<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt-Bibliothek JF</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <div class="logo">
                    <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="16" y1="13" x2="8" y2="13"></line>
                        <line x1="16" y1="17" x2="8" y2="17"></line>
                        <polyline points="10 9 9 9 8 9"></polyline>
                    </svg>
                    <h1>Prompt-Bibliothek <span class="logo-suffix">JF</span></h1>
                </div>

                <div class="header-actions">
                    <div class="backup-status" id="backupStatus">
                        <span class="backup-dot"></span>
                        <span class="backup-text">Wird geladen...</span>
                    </div>

                    <button class="btn btn-secondary" onclick="loadFromCloud()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="23 4 23 10 17 10"></polyline>
                            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
                        </svg>
                        Aus Cloud laden
                    </button>

                    <button class="btn btn-primary-dark" onclick="saveToCloud()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"></path>
                        </svg>
                        Cloud-Backup
                    </button>

                    <button class="btn btn-ghost" onclick="importJSON()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="17 8 12 3 7 8"></polyline>
                            <line x1="12" y1="3" x2="12" y2="15"></line>
                        </svg>
                        Import
                    </button>

                    <!-- Export Dropdown -->
                    <div class="dropdown">
                        <button class="btn btn-ghost dropdown-trigger" onclick="toggleExportDropdown()">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                <polyline points="7 10 12 15 17 10"></polyline>
                                <line x1="12" y1="15" x2="12" y2="3"></line>
                            </svg>
                            Export
                            <svg class="dropdown-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="6 9 12 15 18 9"></polyline>
                            </svg>
                        </button>
                        <div class="dropdown-menu" id="exportDropdown">
                            <button class="dropdown-item" onclick="exportMarkdown(); closeExportDropdown()">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                                    <polyline points="14 2 14 8 20 8"></polyline>
                                </svg>
                                Alle als Markdown
                            </button>
                            <button class="dropdown-item" onclick="exportJSON(); closeExportDropdown()">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                                    <polyline points="14 2 14 8 20 8"></polyline>
                                </svg>
                                Alle als JSON
                            </button>
                        </div>
                    </div>

                    <button class="btn btn-primary" onclick="openAddPromptModal()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                        Neuer Prompt
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Sidebar -->
            <aside class="sidebar">
                <div class="sidebar-section">
                    <div class="sidebar-header">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                        </svg>
                        <span>Kategorien</span>
                        <button class="add-category-btn" onclick="openAddCategoryModal()" title="Kategorie hinzufügen">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="12" y1="5" x2="12" y2="19"></line>
                                <line x1="5" y1="12" x2="19" y2="12"></line>
                            </svg>
                        </button>
                    </div>
                    <nav class="category-list" id="categoryList">
                        <!-- Categories will be rendered here -->
                    </nav>
                </div>
            </aside>

            <!-- Content Area -->
            <div class="content-area">
                <!-- Search Bar -->
                <div class="search-container">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" class="search-input" id="searchInput" placeholder="Suche nach Titel, Inhalt, Tags oder Zielen..." oninput="filterPrompts()">
                </div>

                <!-- Prompts List -->
                <div class="prompts-list" id="promptsList">
                    <!-- Prompts will be rendered here -->
                </div>
            </div>
        </main>
    </div>

    <!-- Add/Edit Prompt Modal -->
    <div class="modal-overlay" id="promptModal">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modalTitle">Neuer Prompt</h2>
                <button class="modal-close" onclick="closePromptModal()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="promptId">

                <div class="form-group">
                    <label for="promptTitle">Titel</label>
                    <input type="text" id="promptTitle" placeholder="Z.B. Feedback zu Schülertexten">
                </div>

                <div class="form-group">
                    <label for="promptContent">
                        Prompt-Inhalt
                        <span class="label-hint">(Variablen: <code>{{variable}}</code>)</span>
                    </label>
                    <textarea id="promptContent" rows="10" placeholder="Dein Prompt hier... Nutze {{variable}} für dynamische Platzhalter."></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="promptCategory">Kategorie</label>
                        <select id="promptCategory">
                            <option value="">Kategorie wählen</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="promptTags">Tags (kommagetrennt)</label>
                        <input type="text" id="promptTags" placeholder="Mathematik, Klasse 7, ...">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="promptLicense">Lizenz</label>
                        <select id="promptLicense">
                            <option value="CC BY 4.0">CC BY 4.0</option>
                            <option value="CC BY-SA 4.0">CC BY-SA 4.0</option>
                            <option value="CC BY-NC 4.0">CC BY-NC 4.0</option>
                            <option value="CC0 1.0">CC0 1.0</option>
                            <option value="Eigene Angabe">Eigene Angabe</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="promptAuthor">Autor</label>
                        <input type="text" id="promptAuthor" placeholder="Dein Name">
                    </div>
                </div>

                <div class="metadata-section">
                    <h4>Metadaten (optional)</h4>
                    <div class="form-row">
                        <div class="form-group">
                            <input type="text" id="metaTargetAudience" placeholder="Zielgruppe (z.B. Lehrkräfte)">
                        </div>
                        <div class="form-group">
                            <input type="text" id="metaSubject" placeholder="Fachbereich">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <select id="metaDifficulty">
                                <option value="Einfach">Einfach</option>
                                <option value="Mittel" selected>Mittel</option>
                                <option value="Fortgeschritten">Fortgeschritten</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <input type="text" id="metaTimeRequired" placeholder="Zeitaufwand (z.B. 5 Min)">
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-ghost" onclick="closePromptModal()">Abbrechen</button>
                <button class="btn btn-primary" onclick="savePrompt()">Speichern</button>
            </div>
        </div>
    </div>

    <!-- Add/Edit Category Modal -->
    <div class="modal-overlay" id="categoryModal">
        <div class="modal modal-small">
            <div class="modal-header">
                <h2 id="categoryModalTitle">Neue Kategorie</h2>
                <button class="modal-close" onclick="closeCategoryModal()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="editCategoryIndex" value="">
                <div class="form-group">
                    <label for="newCategoryName">Kategoriename</label>
                    <input type="text" id="newCategoryName" placeholder="Z.B. Unterrichtsvorbereitung">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-ghost" onclick="closeCategoryModal()">Abbrechen</button>
                <button class="btn btn-primary" id="categoryModalSaveBtn" onclick="saveCategory()">Hinzufügen</button>
            </div>
        </div>
    </div>

    <!-- Variables Modal -->
    <div class="modal-overlay" id="variablesModal">
        <div class="modal modal-small">
            <div class="modal-header">
                <h2>Variablen ausfüllen</h2>
                <button class="modal-close" onclick="closeVariablesModal()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div class="modal-body" id="variablesForm">
                <!-- Variable inputs will be rendered here -->
            </div>
            <div class="modal-footer">
                <button class="btn btn-ghost" onclick="closeVariablesModal()">Abbrechen</button>
                <button class="btn btn-primary" onclick="copyWithVariables()">Kopieren</button>
            </div>
        </div>
    </div>

    <!-- Version History Modal -->
    <div class="modal-overlay" id="versionModal">
        <div class="modal">
            <div class="modal-header">
                <h2>Versionshistorie</h2>
                <button class="modal-close" onclick="closeVersionModal()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div class="modal-body" id="versionList">
                <!-- Versions will be rendered here -->
            </div>
            <div class="modal-footer">
                <button class="btn btn-ghost" onclick="closeVersionModal()">Schließen</button>
            </div>
        </div>
    </div>

    <!-- Prompt View Modal (Vollansicht) -->
    <div class="modal-overlay" id="viewModal">
        <div class="modal modal-large">
            <div class="modal-header">
                <h2 id="viewModalTitle">Prompt ansehen</h2>
                <button class="modal-close" onclick="closeViewModal()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div class="modal-body" id="viewModalBody">
                <!-- Prompt content will be rendered here -->
            </div>
            <div class="modal-footer">
                <div class="view-modal-actions">
                    <div class="dropdown">
                        <button class="btn btn-secondary dropdown-trigger" onclick="toggleSingleExportDropdown()">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                <polyline points="7 10 12 15 17 10"></polyline>
                                <line x1="12" y1="15" x2="12" y2="3"></line>
                            </svg>
                            Exportieren
                            <svg class="dropdown-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="6 9 12 15 18 9"></polyline>
                            </svg>
                        </button>
                        <div class="dropdown-menu dropdown-menu-up" id="singleExportDropdown">
                            <button class="dropdown-item" onclick="exportSinglePromptMD(); closeSingleExportDropdown()">
                                Als Markdown
                            </button>
                            <button class="dropdown-item" onclick="exportSinglePromptJSON(); closeSingleExportDropdown()">
                                Als JSON
                            </button>
                        </div>
                    </div>
                </div>
                <div>
                    <button class="btn btn-ghost" onclick="closeViewModal()">Schließen</button>
                    <button class="btn btn-primary" onclick="copyCurrentPrompt()">Kopieren</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast">
        <span id="toastMessage"></span>
    </div>

    <!-- Hidden file input for import -->
    <input type="file" id="fileInput" accept=".json" style="display: none" onchange="handleFileImport(event)">

    <script src="app.js"></script>
</body>
</html>
