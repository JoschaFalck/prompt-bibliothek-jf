<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt-Bibliothek JF</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1 class="logo">Prompt-Bibliothek JF</h1>
                <div class="sync-status" id="syncStatus">
                    <span class="sync-icon">●</span>
                    <span class="sync-text">Wird geladen...</span>
                </div>
            </div>

            <div class="sidebar-actions">
                <button class="btn btn-ghost btn-sm" onclick="loadFromCloud()">
                    <span class="btn-icon">↓</span> Aus Cloud laden
                </button>
                <button class="btn btn-ghost btn-sm" onclick="forceCloudBackup()">
                    <span class="btn-icon">↑</span> Cloud-Backup
                </button>
                <div class="dropdown">
                    <button class="btn btn-ghost btn-sm" onclick="toggleImportDropdown()">
                        <span class="btn-icon">📥</span> Import
                    </button>
                    <div class="dropdown-menu" id="importDropdown">
                        <button class="dropdown-item" onclick="importMarkdown()">Markdown importieren</button>
                        <button class="dropdown-item" onclick="importJSON()">JSON importieren</button>
                    </div>
                </div>
                <div class="dropdown">
                    <button class="btn btn-ghost btn-sm" onclick="toggleExportDropdown()">
                        <span class="btn-icon">📤</span> Export
                    </button>
                    <div class="dropdown-menu" id="exportDropdown">
                        <button class="dropdown-item" onclick="exportAllAsMarkdown()">Alle als Markdown</button>
                        <button class="dropdown-item" onclick="exportAllAsJSON()">Alle als JSON</button>
                    </div>
                </div>
            </div>

            <button class="btn btn-primary new-prompt-btn" onclick="openModal()">
                <span class="btn-icon">+</span> Neuer Prompt
            </button>

            <nav class="categories-nav">
                <h2 class="categories-title">Kategorien</h2>
                <ul class="categories-list" id="categoriesList">
                    <!-- Kategorien werden hier dynamisch eingefügt -->
                </ul>
                <button class="btn btn-ghost add-category-btn" onclick="openCategoryModal()">
                    <span class="btn-icon">+</span> Neue Kategorie
                </button>
            </nav>
        </aside>

        <!-- Hauptbereich -->
        <main class="main-content">
            <div class="prompts-grid" id="promptsGrid">
                <!-- Prompts werden hier dynamisch eingefügt -->
            </div>
        </main>
    </div>

    <!-- Modal: Neuer/Bearbeiten Prompt -->
    <div class="modal-overlay" id="promptModal">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle">Neuer Prompt</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="promptId">

                <div class="form-group">
                    <label for="promptTitle">Titel</label>
                    <input type="text" id="promptTitle" class="form-input" placeholder="Prompt-Titel eingeben">
                </div>

                <div class="form-group">
                    <label for="promptContent">Prompt-Inhalt (Variablen: {{variable}})</label>
                    <textarea id="promptContent" class="form-textarea" rows="10" placeholder="Prompt hier eingeben..."></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="promptCategory">Kategorie</label>
                        <select id="promptCategory" class="form-select">
                            <option value="">Kategorie wählen</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="promptTags">Tags (kommagetrennt)</label>
                        <input type="text" id="promptTags" class="form-input" placeholder="tag1, tag2, tag3">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="promptLicense">Lizenz</label>
                        <select id="promptLicense" class="form-select">
                            <option value="CC BY 4.0">CC BY 4.0</option>
                            <option value="CC BY-SA 4.0">CC BY-SA 4.0</option>
                            <option value="CC BY-NC 4.0">CC BY-NC 4.0</option>
                            <option value="CC0 1.0">CC0 1.0</option>
                            <option value="custom">Eigene Angabe</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="promptAuthor">Autor</label>
                        <input type="text" id="promptAuthor" class="form-input" placeholder="Dein Name">
                    </div>
                </div>

                <details class="metadata-details">
                    <summary>Metadaten (optional)</summary>
                    <div class="metadata-content">
                        <div class="form-group">
                            <label for="promptDifficulty">Schwierigkeitsgrad</label>
                            <select id="promptDifficulty" class="form-select">
                                <option value="beginner">Einfach</option>
                                <option value="intermediate">Mittel</option>
                                <option value="advanced">Fortgeschritten</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="promptNotes">Notizen</label>
                            <textarea id="promptNotes" class="form-textarea" rows="3" placeholder="Zusätzliche Notizen..."></textarea>
                        </div>
                    </div>
                </details>
            </div>
            <div class="modal-footer">
                <button class="btn btn-ghost" onclick="closeModal()">Abbrechen</button>
                <button class="btn btn-primary" onclick="savePrompt()">Speichern</button>
            </div>
        </div>
    </div>

    <!-- Modal: Neue Kategorie -->
    <div class="modal-overlay" id="categoryModal">
        <div class="modal modal-small">
            <div class="modal-header">
                <h2 class="modal-title">Neue Kategorie</h2>
                <button class="modal-close" onclick="closeCategoryModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="categoryName">Kategoriename</label>
                    <input type="text" id="categoryName" class="form-input" placeholder="z.B. Kreatives Schreiben">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-ghost" onclick="closeCategoryModal()">Abbrechen</button>
                <button class="btn btn-primary" onclick="saveCategory()">Hinzufügen</button>
            </div>
        </div>
    </div>

    <!-- Modal: Variablen ausfüllen -->
    <div class="modal-overlay" id="variablesModal">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title">Variablen ausfüllen</h2>
                <button class="modal-close" onclick="closeVariablesModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div id="variablesForm">
                    <!-- Variablen-Felder werden hier dynamisch eingefügt -->
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-ghost" onclick="closeVariablesModal()">Abbrechen</button>
                <button class="btn btn-primary" onclick="copyWithVariables()">Kopieren</button>
            </div>
        </div>
    </div>

    <!-- Modal: Versionshistorie -->
    <div class="modal-overlay" id="versionsModal">
        <div class="modal modal-large">
            <div class="modal-header">
                <h2 class="modal-title">Versionshistorie</h2>
                <button class="modal-close" onclick="closeVersionsModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div id="versionsList" class="versions-list">
                    <!-- Versionen werden hier dynamisch eingefügt -->
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-ghost" onclick="closeVersionsModal()">Schließen</button>
            </div>
        </div>
    </div>

    <!-- Modal: Prompt ansehen -->
    <div class="modal-overlay" id="viewModal">
        <div class="modal modal-large">
            <div class="modal-header">
                <h2 class="modal-title" id="viewModalTitle">Prompt ansehen</h2>
                <button class="modal-close" onclick="closeViewModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div id="viewModalContent">
                    <!-- Prompt-Inhalt wird hier dynamisch eingefügt -->
                </div>
            </div>
            <div class="modal-footer">
                <div class="view-modal-actions">
                    <div class="dropdown">
                        <button class="btn btn-ghost btn-sm" onclick="toggleViewExportDropdown()">
                            <span class="btn-icon">📤</span> Exportieren
                        </button>
                        <div class="dropdown-menu" id="viewExportDropdown">
                            <button class="dropdown-item" onclick="exportCurrentAsMarkdown()">Als Markdown</button>
                            <button class="dropdown-item" onclick="exportCurrentAsJSON()">Als JSON</button>
                        </div>
                    </div>
                    <div class="move-dropdown-container">
                        <button class="btn btn-ghost btn-sm" onclick="toggleViewMoveDropdown()">
                            <span class="btn-icon">📁</span> Verschieben
                        </button>
                        <div class="dropdown-menu view-move-dropdown" id="viewMoveDropdown">
                            <!-- Kategorien werden dynamisch eingefügt -->
                        </div>
                    </div>
                </div>
                <div>
                    <button class="btn btn-ghost" onclick="closeViewModal()">Schließen</button>
                    <button class="btn btn-secondary" onclick="editCurrentPrompt()">Bearbeiten</button>
                    <button class="btn btn-primary" onclick="copyCurrentPrompt()">Kopieren</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast-Benachrichtigung -->
    <div class="toast" id="toast"></div>

    <!-- Versteckte File-Inputs für Import -->
    <input type="file" id="importMarkdownInput" accept=".md,.txt" style="display: none" onchange="handleMarkdownImport(event)">
    <input type="file" id="importJSONInput" accept=".json" style="display: none" onchange="handleJSONImport(event)">

    <script src="app.js"></script>
</body>
</html>
