<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt – Prompt-Bibliothek JF</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #eff6ff 50%, #f1f5f9 100%);
            min-height: 100vh;
            color: #1e293b;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
        }

        .page-header {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            margin-bottom: 1.75rem;
            color: #64748b;
            font-size: 0.85rem;
        }

        .page-header-logo {
            font-size: 1.4rem;
        }

        .share-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 700px;
            overflow: hidden;
        }

        .card-header {
            padding: 1.5rem 2rem 1.1rem;
            border-bottom: 1px solid #f1f5f9;
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: #0f172a;
            line-height: 1.3;
        }

        .card-meta {
            margin-top: 0.4rem;
            font-size: 0.8rem;
            color: #94a3b8;
        }

        .card-body {
            padding: 1.5rem 2rem;
        }

        .prompt-text {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 1.25rem 1.5rem;
            white-space: pre-wrap;
            font-size: 0.95rem;
            line-height: 1.75;
            color: #334155;
            font-family: inherit;
        }

        .card-footer {
            padding: 1rem 2rem 1.5rem;
            display: flex;
            justify-content: flex-end;
        }

        .btn-copy {
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0.7rem 1.4rem;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s ease;
        }

        .btn-copy:hover {
            background: #1d4ed8;
        }

        .btn-copy.copied {
            background: #16a34a;
        }

        .state-box {
            padding: 3rem 2rem;
            text-align: center;
            color: #64748b;
        }

        .state-box.error .state-title {
            color: #ef4444;
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .state-box p {
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="page-header">
        <span class="page-header-logo">📚</span>
        <span>Prompt-Bibliothek JF</span>
    </div>

    <div class="share-card" id="shareCard">
        <div class="state-box">
            <p>Prompt wird geladen…</p>
        </div>
    </div>

    <script>
        const API_URL = '/.netlify/functions/prompts';

        async function load() {
            const params = new URLSearchParams(window.location.search);
            const promptId = params.get('id');

            if (!promptId) {
                showError('Kein Prompt angegeben.');
                return;
            }

            try {
                const res = await fetch(API_URL);
                if (!res.ok) throw new Error();
                const data = await res.json();
                const prompt = (data.prompts || []).find(p => p.id === promptId);
                if (!prompt) {
                    showError('Dieser Prompt wurde nicht gefunden.');
                    return;
                }
                render(prompt);
            } catch {
                showError('Prompt konnte nicht geladen werden.');
            }
        }

        function render(prompt) {
            const meta = [];
            if (prompt.category) meta.push(prompt.category);
            if (prompt.author) meta.push('von ' + prompt.author);

            document.getElementById('shareCard').innerHTML = `
                <div class="card-header">
                    <div class="card-title">${esc(prompt.title)}</div>
                    ${meta.length ? `<div class="card-meta">${esc(meta.join(' · '))}</div>` : ''}
                </div>
                <div class="card-body">
                    <div class="prompt-text" id="promptText">${esc(prompt.content)}</div>
                </div>
                <div class="card-footer">
                    <button class="btn-copy" id="copyBtn" onclick="copyText()">📋 Prompt kopieren</button>
                </div>
            `;

            document.title = prompt.title + ' – Prompt-Bibliothek JF';
        }

        function copyText() {
            const text = document.getElementById('promptText').textContent;
            const btn = document.getElementById('copyBtn');
            navigator.clipboard.writeText(text).then(() => {
                btn.textContent = '✓ Kopiert!';
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.innerHTML = '📋 Prompt kopieren';
                    btn.classList.remove('copied');
                }, 2000);
            }).catch(() => {
                // Fallback für ältere Browser
                const sel = window.getSelection();
                const range = document.createRange();
                range.selectNodeContents(document.getElementById('promptText'));
                sel.removeAllRanges();
                sel.addRange(range);
                document.execCommand('copy');
                sel.removeAllRanges();
                btn.textContent = '✓ Kopiert!';
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.innerHTML = '📋 Prompt kopieren';
                    btn.classList.remove('copied');
                }, 2000);
            });
        }

        function showError(msg) {
            document.getElementById('shareCard').innerHTML = `
                <div class="state-box error">
                    <div class="state-title">Nicht gefunden</div>
                    <p>${esc(msg)}</p>
                </div>
            `;
        }

        function esc(text) {
            const d = document.createElement('div');
            d.textContent = text;
            return d.innerHTML;
        }

        load();
    </script>
</body>
</html>
